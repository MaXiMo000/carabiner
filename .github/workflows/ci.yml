name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI004: declared at the top level and read-only. A security tool that ships a
# workflow tripping its own rules has nothing to say to anyone.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor, not just today.
        python: ["3.10", "3.13"]
    steps:
      # CI003: actions pinned to full commit SHAs. A tag is mutable -- whoever
      # controls the action repo can repoint it at new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install PyYAML
      # The secrets engine shells out to gitleaks. Installing it here is what
      # keeps the subprocess path from shipping unverified -- the integration
      # test skips silently when the binary is absent.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Fixture suite
        run: python tests/test_carabiner.py

  dogfood:
    # The claim on the README has to hold on every commit: carabiner finds
    # nothing in carabiner.
    runs-on: ubuntu-latest
    # CI005 in practice: security-events lives on the one job that uploads, not
    # at the top level where every job would inherit it.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML
      - name: carabiner scans carabiner
        run: python -m carabiner.cli scan --all --fail-on low --sarif carabiner.sarif
      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef  # codeql-bundle-v2.26.3
        with:
          sarif_file: carabiner.sarif

  image:
    # Build and smoke-test the container on every change. The gitleaks episode
    # is the precedent: a path that is never executed is a silent failure
    # waiting for its first real user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: docker build -t carabiner:ci .
      - name: It runs, as a non-root user, with both scanners present
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id carabiner:ci -u)" = "10001"
          docker run --rm --entrypoint gitleaks carabiner:ci version
          docker run --rm --entrypoint osv-scanner carabiner:ci --version
      - name: It finds the planted bug in a fixture, mounted read-only
        run: |
          set -euo pipefail
          out=$(docker run --rm -v "$PWD/tests/fixtures/ci_pull_request_target:/repo:ro" \
                  carabiner:ci scan --fail-on critical || true)
          echo "$out"
          echo "$out" | grep -q CI001
      - name: And reports nothing on the clean fixture
        run: |
          docker run --rm -v "$PWD/tests/fixtures/clean:/repo:ro" carabiner:ci scan --fail-on low

  package:
    # Build and install the distribution on every commit, not only at release.
    # This exact break -- a second top-level directory confusing setuptools --
    # shipped green through CI and only surfaced when the release ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/carabiner --help > /dev/null
          /tmp/v/bin/carabiner scan --root tests/fixtures/clean --fail-on low
          test "$(/tmp/v/bin/python -c 'import carabiner; print(carabiner.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
