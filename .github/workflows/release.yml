name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests are the gate. A release that skips them is a promise nobody checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install PyYAML
      - run: python tests/test_carabiner.py
      - run: python -m carabiner.cli scan --fail-on low

      # The tag and the packaged version must be the same thing. Without this a
      # tag can ship a tree that still declares the previous version, and the
      # repo then advertises something that does not match what installs.
      - name: The tag agrees with pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$tag  pyproject=$declared"
          test "$tag" = "$declared"

  # Every tag gets a Release, not just a tag. Nine of this repo's eighteen tags
  # had no Release attached -- v0.1.1, v0.1.3, v0.1.6 through v0.1.10, v0.1.12
  # and v0.1.15 -- because publishing was wired to PyPI and ghcr and never to
  # the Releases page. Anyone reading the repo saw a stale latest version.
  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Create the Release with the artefacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "carabiner $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
      - name: It exists, is not a draft, and points at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft \
            --jq 'select(.isDraft == false) | .tagName' | grep -qx "$GITHUB_REF_NAME"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/carabiner
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          # ponytail: linux/amd64 only. The bundled gitleaks and osv-scanner
          # binaries are amd64, which is what CI runners are. arm64 needs
          # TARGETARCH-aware downloads and a second pair of checksums -- add it
          # when someone asks, not before.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Anyone can then verify this image came from this repo and this workflow,
      # rather than from someone who pushed a tag with the same name.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/carabiner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  pypi:
    needs: verify
    # Turn on by setting the repository variable PYPI_ENABLED to "true", once a
    # trusted publisher exists on pypi.org for this repo. Gated rather than
    # failing, so tagging works before the account side is done.
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # OIDC. No long-lived API token lives in this repo.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
