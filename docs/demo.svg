<rect width="956" height="740" rx="8" fill="#0d1117"/>
<rect width="956" height="28" rx="8" fill="#161b22"/><rect y="20" width="956" height="8" fill="#161b22"/>
<circle cx="18" cy="14" r="5" fill="#ff5f57"/><circle cx="36" cy="14" r="5" fill="#febc2e"/><circle cx="54" cy="14" r="5" fill="#28c840"/>
<text x="478.0" y="18" fill="#8b949e" text-anchor="middle" style="font-size:12px">carabiner</text>
<g class="l0"><text x="16" y="54" fill="#7ee787">$</text><text x="32.8" y="54" fill="#f0f6fc" textLength="117.6">carabiner scan</text><rect class="c0" x="32.8" y="40" width="126.0" height="19" fill="#0d1117"/></g>
<text class="l1" x="16" y="73" fill="#ff7b72" textLength="352.8" xml:space="preserve">  CRITICAL CI001  .github/workflows/pr.yml</text>
<text class="l2" x="16" y="92" fill="#c9d1d9" textLength="924.0" xml:space="preserve">           job &#x27;build&#x27; runs on pull_request_target and checks out the PR head -- untrusted code runs with your</text>
<text class="l3" x="16" y="111" fill="#c9d1d9" textLength="151.2" xml:space="preserve">           secrets</text>
<text class="l4" x="16" y="130" fill="#8b949e" textLength="873.6" xml:space="preserve">           fix: use `pull_request`, or split into an untrusted build job and a privileged job that never</text>
<text class="l5" x="16" y="149" fill="#c9d1d9" textLength="252.0" xml:space="preserve">           checks out the head</text>
<text class="l7" x="16" y="187" fill="#ff7b72" textLength="378.0" xml:space="preserve">  HIGH     CI002  .github/workflows/greet.yml</text>
<text class="l8" x="16" y="206" fill="#c9d1d9" textLength="907.2" xml:space="preserve">           job &#x27;hello&#x27; interpolates attacker-controlled context directly into a `run:` block -- a crafted PR</text>
<text class="l9" x="16" y="225" fill="#c9d1d9" textLength="537.6" xml:space="preserve">           title or branch name executes as shell on your runner</text>
<text class="l10" x="16" y="244" fill="#8b949e" textLength="915.6" xml:space="preserve">           fix: pass it through `env:` and reference &quot;$VAR&quot; quoted in the script; the value is then data, not</text>
<text class="l11" x="16" y="263" fill="#c9d1d9" textLength="126.0" xml:space="preserve">           code</text>
<text class="l13" x="16" y="301" fill="#ff7b72" textLength="352.8" xml:space="preserve">  HIGH     CI008  .github/workflows/pr.yml</text>
<text class="l14" x="16" y="320" fill="#c9d1d9" textLength="898.8" xml:space="preserve">           job &#x27;build&#x27; checks out on an untrusted trigger without `persist-credentials: false` -- the token</text>
<text class="l15" x="16" y="339" fill="#c9d1d9" textLength="924.0" xml:space="preserve">           stays in .git/config and any later step, including one running the contributor&#x27;s build scripts, can</text>
<text class="l16" x="16" y="358" fill="#c9d1d9" textLength="151.2" xml:space="preserve">           read it</text>
<text class="l17" x="16" y="377" fill="#8b949e" textLength="882.0" xml:space="preserve">           fix: set `persist-credentials: false` on the checkout, or do not check out untrusted code in a</text>
<text class="l18" x="16" y="396" fill="#c9d1d9" textLength="210.0" xml:space="preserve">           privileged job</text>
<text class="l20" x="16" y="434" fill="#c9d1d9" textLength="109.2" xml:space="preserve">3 new   0.20s</text>
<g class="l22"><text x="16" y="472" fill="#7ee787">$</text><text x="32.8" y="472" fill="#f0f6fc" textLength="487.2">carabiner lock     # accept today&#x27;s findings as a baseline</text><rect class="c22" x="32.8" y="458" width="495.6" height="19" fill="#0d1117"/></g>
<text class="l23" x="16" y="491" fill="#c9d1d9" textLength="487.2" xml:space="preserve">ratcheted: 3 findings accepted -&gt; .carabiner/baseline.json</text>
<text class="l24" x="16" y="510" fill="#c9d1d9" textLength="403.2" xml:space="preserve">only new findings will fail the build from here.</text>
<g class="l26"><text x="16" y="548" fill="#7ee787"></text><text x="32.8" y="548" fill="#8b949e" textLength="529.2"># next week, a PR adds a workflow using some-vendor/deploy@main</text><rect class="c26" x="32.8" y="534" width="537.6" height="19" fill="#0d1117"/></g>
<g class="l28"><text x="16" y="586" fill="#7ee787">$</text><text x="32.8" y="586" fill="#f0f6fc" textLength="117.6">carabiner scan</text><rect class="c28" x="32.8" y="572" width="126.0" height="19" fill="#0d1117"/></g>
<text class="l29" x="16" y="605" fill="#e3b341" textLength="394.8" xml:space="preserve">  MEDIUM   CI003  .github/workflows/release.yml</text>
<text class="l30" x="16" y="624" fill="#c9d1d9" textLength="890.4" xml:space="preserve">           action `some-vendor/deploy@main` is not pinned to a commit -- tracks a moving branch in someone</text>
<text class="l31" x="16" y="643" fill="#c9d1d9" textLength="781.2" xml:space="preserve">           else&#x27;s repository -- what runs here can change tonight without a diff on your side</text>
<text class="l32" x="16" y="662" fill="#8b949e" textLength="672.0" xml:space="preserve">           fix: pin to a full 40-character commit SHA and let Dependabot bump it</text>
<text class="l34" x="16" y="700" fill="#c9d1d9" textLength="571.2" xml:space="preserve">1 new, 1 informational (--info), 3 accepted (carabiner debt)   0.34s</text>
</svg>